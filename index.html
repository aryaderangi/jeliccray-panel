<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GravityZone Panel</title>
    <meta name="theme-color" content="#09090b">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --font-fa: 'Vazirmatn', sans-serif;
            --font-en: 'Outfit', sans-serif;
            --font-ru: 'Rubik', sans-serif;
            --bg-deep: #000000;
            --bg-surface: #070d0f;
            --glass-base: rgba(0, 30, 35, 0.65);
            --glass-border: rgba(0, 212, 212, 0.12);
            --primary: #00d4d4;
            --primary-glow: rgba(0, 212, 212, 0.45);
            --accent: #0ea5e9;
            --cyan: #22d3ee;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #e0fafa;
            --text-muted: #6db8be;
            --card-radius: 24px;
            --btn-radius: 16px;
            --shadow-xl: 0 20px 40px -10px rgba(0,212,212,0.15);
            --neon-shadow: 0 0 25px rgba(0, 212, 212, 0.35);
        }
        body.light-theme {
            --bg-deep: #e8f8f8;
            --bg-surface: #ffffff;
            --glass-base: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 180, 180, 0.1);
            --primary: #0891b2;
            --primary-glow: rgba(8, 145, 178, 0.25);
            --accent: #0369a1;
            --text-main: #0c4a6e;
            --text-muted: #4a9ead;
            --shadow-xl: 0 20px 40px -10px rgba(0,0,0,0.1);
            --neon-shadow: 0 0 15px rgba(8, 145, 178, 0.2);
        }
        *, *::before, *::after { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; font-family: var(--font-fa);
            background-color: var(--bg-deep); color: var(--text-main);
            min-height: 100vh; display: flex; justify-content: center;
            overflow-x: hidden; transition: background 0.5s ease;
        }
        .ambient-light { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: floatOrb 10s infinite alternate ease-in-out; }
        .orb-1 { width: 320px; height: 320px; background: radial-gradient(circle, #00d4d4, #006b6b); top: -80px; left: -80px; animation-duration: 12s; }
        .orb-2 { width: 260px; height: 260px; background: radial-gradient(circle, #0ea5e9, #0c4a6e); bottom: -60px; right: -60px; animation-duration: 15s; animation-delay: -2s; }
        .orb-3 { width: 200px; height: 200px; background: radial-gradient(circle, #22d3ee, #0284c7); top: 40%; left: 40%; animation-duration: 18s; opacity: 0.3; }
        @keyframes floatOrb { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,50px) scale(1.1); } }

        /* Scanline effect for sci-fi feel */
        .ambient-light::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,212,0.015) 2px, rgba(0,212,212,0.015) 4px);
            pointer-events: none;
        }

        .main-container { width: 100%; max-width: 500px; padding: 25px; padding-bottom: 120px; position: relative; z-index: 10; }

        /* NAVBAR */
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 1.6rem; color: var(--primary); animation: spinSlow 10s linear infinite; filter: drop-shadow(0 0 8px var(--primary)); }
        @keyframes spinSlow { 100% { transform: rotate(360deg); } }
        .logo-text { font-family: var(--font-en); font-weight: 900; font-size: 1.15rem; letter-spacing: 1px; }
        .logo-gravity { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }
        .logo-zone { color: var(--accent); }
        .nav-actions { display: flex; gap: 10px; }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 14px;
            background: var(--glass-base); border: 1px solid var(--glass-border);
            color: var(--text-main); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            font-size: 1.2rem; position: relative;
        }
        .icon-btn:hover { background: var(--bg-surface); border-color: var(--primary); color: var(--primary); transform: translateY(-3px) rotate(5deg); box-shadow: var(--neon-shadow); }
        .lang-badge { position: absolute; bottom: -5px; right: -5px; font-size: 0.6rem; background: var(--primary); color: #000; padding: 2px 4px; border-radius: 4px; font-weight: bold; }

        /* HERO CARD */
        .hero-card {
            background: linear-gradient(145deg, rgba(0,212,212,0.06) 0%, rgba(14,165,233,0.03) 100%);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-top: 1px solid rgba(0,212,212,0.2);
            border-radius: var(--card-radius); padding: 30px 20px; text-align: center;
            position: relative; overflow: hidden; box-shadow: var(--shadow-xl); margin-bottom: 25px;
            animation: slideUp 0.6s ease-out;
        }
        .hero-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,212,212,0.06), transparent);
            transform: skewX(-25deg); animation: shimmer 6s infinite; pointer-events: none;
        }
        @keyframes shimmer { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }

        /* Gravitational ring decoration */
        .hero-card::after {
            content: ''; position: absolute; top: -40px; right: -40px;
            width: 150px; height: 150px; border-radius: 50%;
            border: 1px solid rgba(0,212,212,0.1);
            box-shadow: 0 0 0 20px rgba(0,212,212,0.04), 0 0 0 40px rgba(0,212,212,0.02);
            pointer-events: none;
        }

        .avatar-wrapper {
            width: 90px; height: 90px; margin: 0 auto 15px; border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, var(--primary), var(--accent)); position: relative;
            box-shadow: 0 0 25px var(--primary-glow);
        }
        .avatar-inner { width: 100%; height: 100%; background: var(--bg-deep); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar-inner i { font-size: 3rem; color: var(--primary); }
        .username { font-size: 1.5rem; font-weight: 800; margin: 0; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-pill {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 16px;
            border-radius: 50px; font-size: 0.8rem; font-weight: 600;
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
        }
        body.light-theme .status-pill { background: #fff; border-color: #ddd; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; box-shadow: 0 0 8px currentColor; }
        .st-active { color: var(--success); } .st-active .status-dot { background: var(--success); }
        .st-limited { color: var(--warning); } .st-limited .status-dot { background: var(--warning); }
        .st-expired { color: var(--danger); } .st-expired .status-dot { background: var(--danger); }

        /* STATS */
        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card {
            background: var(--glass-base); border: 1px solid var(--glass-border); border-radius: var(--card-radius);
            padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--neon-shadow); }
        .progress-circle { width: 100px; height: 100px; transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: rgba(0,212,212,0.08); stroke-width: 8; }
        body.light-theme .circle-bg { stroke: rgba(0,0,0,0.05); }
        .circle-bar { fill: none; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 2s cubic-bezier(0.22, 1, 0.36, 1); }
        .traffic-stroke { stroke: url(#gradientTraffic); }
        .time-stroke { stroke: url(#gradientTime); }
        .stat-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 18px; }
        .stat-num { font-family: var(--font-en); font-weight: 800; font-size: 1.1rem; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .stat-footer { margin-top: 15px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }

        /* ACTIONS */
        .main-actions { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-bottom: 30px; }
        .btn-glow {
            border: none; padding: 16px; border-radius: var(--btn-radius); font-family: inherit; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; position: relative; overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000; font-weight: 800;
            box-shadow: 0 8px 25px -5px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 35px -5px var(--primary-glow); filter: brightness(1.1); }
        .btn-glass { background: var(--glass-base); color: var(--primary); border: 1px solid var(--glass-border); }
        .btn-glass:hover { background: rgba(0,212,212,0.1); border-color: var(--primary); }

        /* SECTIONS */
        .section-box { margin-bottom: 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; cursor: pointer; }
        .section-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--primary); }
        .toggle-arrow { transition: 0.3s; color: var(--text-muted); }
        .active-section .toggle-arrow { transform: rotate(180deg); color: var(--primary); }
        .section-content { display: none; animation: fadeIn 0.4s ease; }
        .section-content.open { display: block; }
        .btn-copy-all {
            width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0, 212, 212, 0.08); color: var(--primary);
            border: 1px dashed var(--primary); border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-copy-all:hover { background: var(--primary); color: #000; }
        .config-card {
            background: var(--glass-base); border: 1px solid var(--glass-border); padding: 16px; border-radius: 18px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .config-card::after {
            content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent)); transform: scaleX(0); transform-origin: left; transition: 0.3s;
        }
        .config-card:hover { transform: translateX(5px); border-color: rgba(0,212,212,0.25); }
        .config-card:hover::after { transform: scaleX(1); }
        .prot-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: rgba(0,212,212,0.08); color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.75rem;
            border: 1px solid var(--glass-border);
        }
        .conf-info { flex: 1; overflow: hidden; }
        .conf-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conf-meta { font-size: 0.75rem; color: var(--text-muted); }
        .action-icon {
            width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; background: transparent; color: var(--text-muted); border: none; font-size: 1.1rem;
        }
        .action-icon:hover { background: rgba(0,212,212,0.1); color: var(--primary); transform: scale(1.1); }

        /* APP GRID */
        .app-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .app-card {
            background: var(--glass-base); border: 1px solid var(--glass-border); padding: 15px; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: var(--text-main); transition: 0.3s;
        }
        .app-card:hover { background: rgba(0,212,212,0.08); border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--neon-shadow); }
        .app-card i { font-size: 1.8rem; margin-bottom: 8px; color: var(--text-muted); transition: 0.3s; }
        .app-card:hover i { color: var(--primary); }
        .app-name { font-size: 0.9rem; font-weight: 700; }
        .app-os { font-size: 0.75rem; color: var(--text-muted); }

        /* FOOTER BRAND */
        .brand-footer {
            text-align: center; padding: 20px 0 10px;
            border-top: 1px solid var(--glass-border);
            margin-top: 10px;
        }
        .brand-footer-logo { font-family: var(--font-en); font-weight: 900; font-size: 1rem; letter-spacing: 2px; margin-bottom: 8px; }
        .brand-footer-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .brand-link {
            display: inline-flex; align-items: center; gap: 5px;
            color: var(--text-muted); text-decoration: none; font-size: 0.78rem; font-weight: 600; transition: 0.2s;
        }
        .brand-link:hover { color: var(--primary); }
        .brand-link i { font-size: 1rem; }
        .brand-dev { font-size: 0.72rem; color: var(--text-muted); margin-top: 10px; }
        .brand-dev span { color: var(--primary); font-weight: 700; }

        /* ALERTS */
        .toast-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, rgba(0,212,212,0.9), rgba(14,165,233,0.9));
            backdrop-filter: blur(10px); color: #000; padding: 12px 30px; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,212,212,0.3); font-weight: 700; display: flex; align-items: center; gap: 8px;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999; opacity: 0;
        }
        .toast-box.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-body {
            background: var(--bg-surface); padding: 30px; border-radius: 30px; width: 90%; max-width: 340px; text-align: center;
            border: 1px solid var(--glass-border); box-shadow: 0 0 40px var(--primary-glow);
            transform: scale(0.8) translateY(20px); transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-body { transform: scale(1) translateY(0); }
        #qr-display { background: #fff; padding: 15px; border-radius: 16px; margin: 20px auto; width: fit-content; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hidden-elm { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
        body.lang-en { direction: ltr; font-family: var(--font-en); }
        body.lang-ru { direction: ltr; font-family: var(--font-ru); }
    </style>
</head>
<body>
    <div id="data-core"
         data-user="{{ user.username | default('User') }}"
         data-status="{{ user.status | default('active') }}"
         data-used="{{ user.used_traffic | default(0) }}"
         data-limit="{{ user.data_limit | default(0) }}"
         data-expire="{{ user.expire | default(0) }}"
         data-sub="{{ subscription_url | default('') }}"
         style="display:none;"></div>

    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="main-container">
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="logo-area">
                <i class="ri-radar-fill logo-icon"></i>
                <span class="logo-text">
                    <span class="logo-gravity">GRAVITY</span><span class="logo-zone">ZONE</span>
                </span>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="Change Theme">
                    <i class="ri-moon-clear-line" id="theme-icon"></i>
                </button>
                <button class="icon-btn" onclick="cycleLang()" title="Change Language">
                    <i class="ri-translate-2"></i>
                    <span class="lang-badge" id="current-lang-badge">FA</span>
                </button>
            </div>
        </nav>

        <!-- HERO PROFILE -->
        <div class="hero-card">
            <div class="avatar-wrapper">
                <div class="avatar-inner">
                    <i class="ri-user-smile-line"></i>
                </div>
            </div>
            <h1 class="username" id="ui-username">Guest User</h1>
            <div class="status-pill" id="status-pill">
                <span class="status-dot"></span>
                <span id="ui-status">Unknown</span>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-container">
            <div class="stat-card">
                <div style="position:relative; width:100px; height:100px;">
                    <svg class="progress-circle">
                        <defs>
                            <linearGradient id="gradientTime" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00d4d4" />
                                <stop offset="100%" stop-color="#22d3ee" />
                            </linearGradient>
                        </defs>
                        <circle class="circle-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="circle-bar time-stroke" id="time-bar" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="stat-content">
                        <span class="stat-num" id="ui-days">∞</span>
                        <span class="stat-label" data-translate="days">Days</span>
                    </div>
                </div>
                <div class="stat-footer" data-translate="remaining">Remaining</div>
            </div>
            <div class="stat-card">
                <div style="position:relative; width:100px; height:100px;">
                    <svg class="progress-circle">
                        <defs>
                            <linearGradient id="gradientTraffic" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#0ea5e9" />
                                <stop offset="100%" stop-color="#00d4d4" />
                            </linearGradient>
                        </defs>
                        <circle class="circle-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="circle-bar traffic-stroke" id="traffic-bar" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="stat-content">
                        <span class="stat-num" id="ui-used">0 GB</span>
                        <span class="stat-label">Used</span>
                    </div>
                </div>
                <div class="stat-footer" id="ui-total">Total: ∞</div>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="main-actions">
            <button class="btn-glow btn-primary" onclick="copyLink()">
                <i class="ri-file-copy-2-line"></i>
                <span data-translate="copy_link">کپی لینک اشتراک</span>
            </button>
            <button class="btn-glow btn-glass" style="width:50px; padding:0;" onclick="showMainQR()">
                <i class="ri-qr-code-line" style="font-size:1.2rem;"></i>
            </button>
        </div>

        <!-- CONFIGS -->
        <div class="section-box">
            <div class="section-header" onclick="toggleSection('configs-area', this)">
                <span class="section-title"><i class="ri-server-line"></i> <span data-translate="connections">کانکشن‌ها</span></span>
                <i class="ri-arrow-down-s-line toggle-arrow" style="font-size:1.2rem"></i>
            </div>
            <div id="configs-area" class="section-content open">
                <button class="btn-copy-all" onclick="copyAll()">
                    <i class="ri-file-list-3-line"></i> <span data-translate="copy_all">کپی همه کانفیگ‌ها</span>
                </button>
                <div id="config-list">
                    <div style="text-align:center; padding:20px; color:var(--text-muted)">
                        <i class="ri-loader-4-line" style="animation:spinSlow 1s linear infinite; font-size:1.5rem"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- APPS -->
        <div class="section-box">
            <div class="section-header" onclick="toggleSection('apps-area', this)">
                <span class="section-title"><i class="ri-download-cloud-2-line"></i> <span data-translate="downloads">دانلود برنامه‌ها</span></span>
                <i class="ri-arrow-down-s-line toggle-arrow"></i>
            </div>
            <div id="apps-area" class="section-content">
                <div class="app-grid">
                    <a href="https://github.com/2dust/v2rayNG/releases/latest" target="_blank" class="app-card">
                        <i class="ri-android-fill"></i> <span class="app-name">v2rayNG</span> <span class="app-os">Android</span>
                    </a>
                    <a href="https://apps.apple.com/us/app/v2box-v2ray-client/id6446814690" target="_blank" class="app-card">
                        <i class="ri-apple-fill"></i> <span class="app-name">V2Box</span> <span class="app-os">iOS</span>
                    </a>
                    <a href="https://github.com/2dust/v2rayN/releases" target="_blank" class="app-card">
                        <i class="ri-windows-fill"></i> <span class="app-name">v2rayN</span> <span class="app-os">Windows</span>
                    </a>
                    <a href="https://github.com/MatsuriDayo/nekoray/releases" target="_blank" class="app-card">
                        <i class="ri-ubuntu-fill"></i> <span class="app-name">Nekoray</span> <span class="app-os">Linux</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- BRAND FOOTER -->
        <div class="brand-footer">
            <div class="brand-footer-logo">
                <span style="color:var(--primary)">GRAVITY</span><span style="color:var(--accent)">ZONE</span>
            </div>
            <div class="brand-footer-links">
                <a href="https://t.me/GravityZone" target="_blank" class="brand-link">
                    <i class="ri-telegram-fill"></i> GravityZone
                </a>
                <a href="https://github.com/aryaderangi" target="_blank" class="brand-link">
                    <i class="ri-github-fill"></i> aryaderangi
                </a>
            </div>
            <div class="brand-dev">Designed & Built by <span>@aryaderangi</span> · Arya Darangi</div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-box" id="toast">
        <i class="ri-checkbox-circle-fill"></i> <span id="toast-msg">Copied!</span>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal" onclick="closeModal()">
        <div class="modal-body" onclick="event.stopPropagation()">
            <h3 style="margin-top:0; margin-bottom:10px; color:var(--primary)">QR Code</h3>
            <div id="qr-display"></div>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:20px;">Scan to import</p>
            <button class="btn-glow btn-glass" style="width:100%" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const i18n = {
            fa: { active:"فعال", limited:"محدود شده", expired:"منقضی", disabled:"غیرفعال", pending:"در انتظار", unlimited:"حجم نامحدود", days:"روز", remaining:"باقی‌مانده", copy_link:"کپی لینک اشتراک", connections:"کانکشن‌ها", copy_all:"کپی همه کانفیگ‌ها", downloads:"دانلود برنامه‌ها", copied:"کپی شد!", dir:"rtl" },
            en: { active:"Active", limited:"Limited", expired:"Expired", disabled:"Disabled", pending:"Pending", unlimited:"Unlimited Data", days:"Days", remaining:"Remaining", copy_link:"Copy Subscription", connections:"Connections", copy_all:"Copy All Configs", downloads:"Downloads", copied:"Copied!", dir:"ltr" },
            ru: { active:"Активный", limited:"Лимит", expired:"Истек", disabled:"Отключено", pending:"В ожидании", unlimited:"Безлимит", days:"дней", remaining:"Осталось", copy_link:"Ссылка подписки", connections:"Конфигурации", copy_all:"Копировать все", downloads:"Приложения", copied:"Скопировано!", dir:"ltr" },
            ar: { active:"نشط", limited:"محدود", expired:"منتهية", disabled:"معطل", pending:"قيد الانتظار", unlimited:"بيانات غير محدودة", days:"أيام", remaining:"متبقي", copy_link:"نسخ الرابط", connections:"الاتصالات", copy_all:"نسخ الكل", downloads:"تنزيل", copied:"تم النسخ!", dir:"rtl" }
        };
        const supportedLangs = ['fa','en','ru','ar'];
        const core = document.getElementById('data-core').dataset;
        let currentLang = localStorage.getItem('lang') || 'fa';
        let currentTheme = localStorage.getItem('theme') || 'dark';

        function init() {
            setTheme(currentTheme); setLang(currentLang);
            document.getElementById('ui-username').textContent = core.user;
            const stPill = document.getElementById('status-pill');
            const stText = document.getElementById('ui-status');
            stPill.className = 'status-pill';
            let raw = (core.status || 'active').toLowerCase().trim();
            let vs = 'active';
            if (raw === 'false' || raw.includes('disabled')) vs = 'disabled';
            else if (raw.includes('limited')) vs = 'limited';
            else if (raw.includes('pending')) vs = 'pending';
            else if (raw.includes('expired')) vs = 'expired';
            else if (raw === 'true' || raw.includes('active')) vs = 'active';
            let daysLeft = 0;
            const expire = parseFloat(core.expire) || 0;
            if (expire) { const diff = expire - Math.floor(Date.now()/1000); if(diff>0) daysLeft = Math.ceil(diff/86400); } else daysLeft = Infinity;
            const statusMap = { active:'st-active', limited:'st-limited', expired:'st-expired', disabled:'st-expired', pending:'st-limited' };
            stPill.classList.add(statusMap[vs] || 'st-expired');
            stText.textContent = i18n[currentLang][vs] || vs;
            renderStats(daysLeft, expire);
            fetchConfigs();
        }

        function formatBytes(b) { if(!+b) return '0 MB'; const k=1024,s=['B','KB','MB','GB','TB'],i=Math.floor(Math.log(b)/Math.log(k)); return parseFloat((b/Math.pow(k,i)).toFixed(2))+' '+s[i]; }

        function renderStats(daysLeft, expire) {
            const used = parseFloat(core.used)||0, limit = parseFloat(core.limit)||0;
            document.getElementById('ui-used').textContent = formatBytes(used);
            document.getElementById('ui-total').textContent = limit ? `Total: ${formatBytes(limit)}` : i18n[currentLang].unlimited;
            animateCircle('traffic-bar', limit ? Math.min((used/limit)*100,100) : 0);
            document.getElementById('ui-days').textContent = expire ? daysLeft : '∞';
            animateCircle('time-bar', expire ? (daysLeft > 0 ? 75 : 0) : 100);
        }

        function animateCircle(id, percent) {
            setTimeout(() => { const c = document.getElementById(id), r = c.getAttribute('r'), circ = 2*Math.PI*r; c.style.strokeDashoffset = circ - (percent/100)*circ; }, 300);
        }

        function fetchConfigs() {
            let url = core.sub; if(!url) url = window.location.href;
            fetch(url).then(r=>r.text()).then(txt => {
                let decoded = txt;
                try { const clean = txt.replace(/\s/g,''); if(/^[A-Za-z0-9+/=]+$/.test(clean)) decoded = atob(clean); } catch(e){}
                renderConfigList(decoded.split(/\r?\n/).filter(x=>x.trim().length>5));
            }).catch(() => { document.getElementById('config-list').innerHTML = `<div style="text-align:center;color:var(--danger)">Error loading configs</div>`; });
        }

        function renderConfigList(lines) {
            const container = document.getElementById('config-list'); container.innerHTML = '';
            lines.forEach((line, i) => {
                let proto = line.split('://')[0].toUpperCase(), name = `Config ${i+1}`;
                if(line.includes('#')) { try { name = decodeURIComponent(line.split('#').pop()); } catch(e){} }
                const card = document.createElement('div'); card.className = 'config-card';
                card.innerHTML = `<div class="prot-icon">${proto.substring(0,3)}</div><div class="conf-info"><div class="conf-name">${name}</div><div class="conf-meta">${proto}</div></div><button class="action-icon" onclick="copyTxt('${line}')"><i class="ri-file-copy-line"></i></button><button class="action-icon" onclick="showQR('${line}')"><i class="ri-qr-code-line"></i></button><textarea class="hidden-elm copy-target">${line}</textarea>`;
                container.appendChild(card);
            });
        }

        function copyLink() { copyTxt(core.sub || window.location.href); }
        function copyAll() { let all=""; document.querySelectorAll('.copy-target').forEach(t=>all+=t.value+"\n"); if(all) copyTxt(all); }
        function copyTxt(txt) { if(navigator.clipboard) navigator.clipboard.writeText(txt).then(showToast).catch(()=>fallbackCopy(txt)); else fallbackCopy(txt); }
        function fallbackCopy(txt) { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(); }
        function showToast() { const t=document.getElementById('toast'); document.getElementById('toast-msg').textContent=i18n[currentLang].copied; t.classList.add('active'); setTimeout(()=>t.classList.remove('active'),2000); }
        function showMainQR() { showQR(core.sub || window.location.href); }
        function showQR(txt) { const el=document.getElementById('qr-display'); el.innerHTML=''; new QRCode(el,{text:txt,width:200,height:200,colorDark:"#000",colorLight:"#fff"}); document.getElementById('modal').classList.add('active'); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function toggleSection(id, header) { const el=document.getElementById(id); el.classList.toggle('open'); header.classList.toggle('active-section'); }
        function toggleTheme() { currentTheme = currentTheme==='dark'?'light':'dark'; localStorage.setItem('theme',currentTheme); setTheme(currentTheme); }
        function setTheme(t) { if(t==='light'){document.body.classList.add('light-theme');document.getElementById('theme-icon').className='ri-sun-line';}else{document.body.classList.remove('light-theme');document.getElementById('theme-icon').className='ri-moon-clear-line';} }
        function cycleLang() { const idx=supportedLangs.indexOf(currentLang); currentLang=supportedLangs[(idx+1)%supportedLangs.length]; localStorage.setItem('lang',currentLang); setLang(currentLang); init(); }
        function setLang(l) { document.documentElement.dir=i18n[l].dir; document.body.className=document.body.className.replace(/lang-\w+/,'')+` lang-${l}`; document.getElementById('current-lang-badge').textContent=l.toUpperCase(); document.querySelectorAll('[data-translate]').forEach(el=>{const k=el.getAttribute('data-translate');if(i18n[l][k])el.textContent=i18n[l][k];}); }
        window.onload = init;
    </script>
</body>
</html>
